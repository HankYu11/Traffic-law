# 取締酒後駕車作業程序 — 結構化版本（由原始 PDF 人工轉寫，保留原文用語）
# 原始文件：新北市政府警察局林口分局公告之「取締酒後駕車作業程序」（共八頁，檔案建立 2018-04）
# 注意：本 SOP 版本早於多次修法，系統會自動比對現行法規並標示不一致處（見 sop_check）。
id: dui
title: 取締酒後駕車作業程序
domains: [dui]
version_label: 2018 年版（林口分局公告）
version_date: "2018-04-26"
source_url: https://www.linkou.police.ntpc.gov.tw/dl-13040-6c2ce49b-14a6-4ce5-b7f1-58c42a76d11a.html
source_file: data/raw/sop/dui_sop_linkou.pdf
basis:
  - 警察職權行使法
  - 刑法第一百八十五條之三
  - 道路交通管理處罰條例第七條之二、第三十五條、第六十七條及第八十五條之二
  - 道路交通安全規則第一百十四條
  - 違反道路交通管理事件統一裁罰基準及處理細則第十條至第十二條、第十六條、第十九條之一及第十九條之二
  - 刑事訴訟法第八十八條、第九十五條及第一百條之三
forms:
  - 舉發違反道路交通管理事件通知單
  - 交通違規勸導單
  - 受理各類案件紀錄表
  - 刑法第一百八十五條之三第一項第二款案件測試觀察紀錄表
  - 警察行使職權民眾異議紀錄表
  - 工作紀錄簿

steps:
  - id: plan
    phase: 準備階段
    title: 勤務規劃
    role: 所長／分局長
    source_page: 1
    actions:
      - 一般勤務中實施交通稽查，或依客觀合理判斷易生危害之交通工具攔停稽查。
      - 計畫性勤務應由地區警察分局長或其相當職務以上長官，指定轄區內經分析研判易發生酒後駕車或酒後肇事之時間及地點。
    legal_basis:
      - {pcode: D0080145, article: "6"}
      - {pcode: D0080145, article: "8"}

  - id: prepare
    phase: 準備階段
    title: 勤前準備與任務分配
    role: 執勤人員／所長
    source_page: 1
    actions:
      - 裝備（視需要增減）：警笛、防彈頭盔、防彈衣、無線電、反光背心、槍械、彈藥、手銬、警用行動電腦、手電筒、指揮棒、酒精測試器、酒精檢知器、照相機、攝影機、交通錐、警示燈、告示牌（執行酒測勤務）、刺胎器、舉發單、測試觀察紀錄表、民眾異議紀錄表。
      - 任務分配以四人一組為原則，分別擔任警戒、指揮攔車、盤查、酒測及舉發。
      - 出勤前檢查酒精測試器日期、時間是否正確，「檢定合格標章」是否逾期、污損，「檢驗合格證書」影本是否隨機攜帶。
    forms: [舉發違反道路交通管理事件通知單, 刑法第一百八十五條之三第一項第二款案件測試觀察紀錄表, 警察行使職權民眾異議紀錄表]
    cautions:
      - 酒精測試器每年須送經濟部標準檢驗局檢驗一次，或使用一千次後送廠商校正及檢定。

  - id: deploy
    phase: 準備階段
    title: 稽查部署
    role: 所長
    source_page: 1
    actions:
      - 稽查地點前方設置告示牌及警示設施（警示燈、交通錐），告知駕駛人警察在執行取締酒後駕車勤務。
      - 視道路條件、交通量及車種組成，得以「縮減車道方式」執行，設置警示、導引設施，指揮車輛減速、觀察。
      - 於稽查地點適當位置設置攝影機，全程錄影蒐證。
    cautions:
      - 攝影機取景宜涵蓋現場全貌，告示牌、車輛通行過程、車牌號碼完整入鏡，以利蒐證不依指示停車之逃逸車輛。
      - 攔檢地點應選擇空曠且明亮位置；警示燈、告示牌至巡邏車應保持適當安全距離。

  - id: stop
    phase: 執行階段
    title: 過濾、攔停車輛
    role: 執勤人員
    source_page: 2
    actions:
      - 過濾、攔停車輛應符合比例原則，有疑似酒後駕車者，始指揮其暫停、觀察，其餘車輛指揮迅速通過。
    legal_basis:
      - {pcode: D0080145, article: "8"}
    cautions:
      - 勿以身體擋車強行攔停，每一次攔檢以一部車輛為原則。
      - 攔檢時不得將頭探入車窗內。

  - id: evade
    phase: 執行階段
    title: 未依指示停車接受酒測稽查
    role: 執勤人員
    source_page: 2
    decision: 逃逸車輛是否再經攔停？
    actions:
      - 經攔停者：出示證件表明身分，告知其行經設有告示執行酒測勤務處所未依指示停車接受酒測稽查；針對該部分製單舉發，並當場移置保管其車輛。研判無飲酒徵兆則人員放行；有飲酒徵兆則詢問飲酒結束時間後依規定實施酒測。
      - 無法攔停者：依道路交通管理處罰條例第七條之二第一項第四款逕行舉發，並依第三十五條第四項規定論處。
      - 棄車逃逸者：除依前開規定舉發外，並當場移置保管該車輛。
    legal_basis:
      - {pcode: K0040012, article: "7-2", paragraph: 1}
      - {pcode: K0040012, article: "35", paragraph: 4}
    forms: [舉發違反道路交通管理事件通知單]

  - id: observe
    phase: 執行階段
    title: 觀察及研判
    role: 執勤人員
    source_page: 2
    decision: 是否有酒精反應或飲酒徵兆？
    actions:
      - 告知駕駛人警方正在執行取締酒後駕車勤務，以酒精檢知器檢知或觀察駕駛人體外表徵，辨明有無飲酒徵兆。
      - 有飲酒徵兆：指揮車輛靠邊停車，請駕駛人下車接受酒精濃度檢測。
      - 無飲酒徵兆：指揮車輛迅速通過，除有明顯違規事實外，不得執行其他交通稽查。
    cautions:
      - 不得要求駕駛人以吐氣方式判別有無飲酒。
    legal_basis:
      - {pcode: D0080145, article: "8"}

  - id: pretest
    phase: 執行階段
    title: 檢測前程序
    role: 執勤人員
    source_page: 3
    actions:
      - 全程連續錄影。
      - 詢問受測者飲酒結束時間；距檢測已達十五分鐘以上者即予檢測。不告知或未達十五分鐘者，告知其可於漱口或達十五分鐘後檢測；請求漱口者，提供漱口。
      - 準備酒精測試器，取出新吹嘴。
      - 告知儀器檢測之流程及注意事項，請其口含吹嘴連續吐氣至儀器顯示取樣完成。
    legal_basis:
      - {pcode: D0080029, article: "19-2", paragraph: 1}

  - id: test
    phase: 執行階段
    title: 實施檢測並告知結果
    role: 執勤人員
    source_page: 3
    actions:
      - 插上新吹嘴，請駕駛人口含吹嘴吐氣；吐氣不足致無法完成取樣時，應重新檢測。
      - 因儀器問題或受測者未符合流程致檢測失敗，應說明原因並請其重新檢測。
      - 告知檢測結果，請其在儀器列印之檢測結果紙上簽名確認；拒絕簽名時，應記明事由。
    cautions:
      - 檢測成功後，不論有無超過標準，不得實施第二次檢測；結果明顯異常時，停用該儀器改用其他儀器，並留存原異常紀錄。
      - 有客觀事實足認受測者無法實施吐氣檢測時，得經其同意後，送受委託醫療或檢驗機構實施血液採樣及測試檢定。
    legal_basis:
      - {pcode: D0080029, article: "19-2", paragraph: 2}
      - {pcode: D0080029, article: "19-2", paragraph: 3}
      - {pcode: D0080029, article: "19-2", paragraph: 4}

  - id: refuse
    phase: 執行階段
    title: 駕駛人拒測
    role: 執勤人員
    source_page: 3
    decision: 是否有其他情事足認不能安全駕駛？
    actions:
      - 經勸導並告知拒測之法律效果（處新臺幣九萬元罰鍰、當場移置保管車輛、並吊銷駕駛執照，三年不得再考領及施以道路交通安全講習）後，仍拒絕檢測者，依道路交通管理處罰條例第三十五條第四項規定製單舉發。
      - 有其他情事足認服用酒類致不能安全駕駛者，已符合刑法第一百八十五條之三第一項第二款要件，應依規定移送法辦（依取締酒駕拒測處理作業程序辦理）。
    legal_basis:
      - {pcode: K0040012, article: "35", paragraph: 4}
      - {pcode: K0040012, article: "67", paragraph: 2}
      - {pcode: D0080029, article: "19-2", paragraph: 5}
      - {pcode: C0000001, article: "185-3", paragraph: 1}
    forms: [舉發違反道路交通管理事件通知單, 刑法第一百八十五條之三第一項第二款案件測試觀察紀錄表]

  - id: result
    phase: 結果處置
    title: 依檢測值分級處置
    role: 執勤人員
    source_page: 4
    decision: 吐氣酒精濃度落在哪個區間？
    actions:
      - 未飲酒或未超過標準：人車放行。
      - 每公升 0.15 以上未滿 0.18 毫克、未肇事且無不能安全駕駛情形：勸導代替舉發，當場告知違規事實、指導法令，填製交通違規勸導單，人車放行。
      - 每公升 0.18 以上未滿 0.25 毫克（或血液 0.03% 以上未滿 0.05%）：製單舉發，並當場移置保管車輛。
      - 每公升 0.25 毫克以上（或血液 0.05% 以上）：移送法辦，並製單舉發，委託合格駕駛人駛離或當場移置保管車輛。
      - 查詢五年內酒駕違規紀錄。
    legal_basis:
      - {pcode: K0040013, article: "114"}
      - {pcode: D0080029, article: "12", paragraph: 1}
      - {pcode: K0040012, article: "35", paragraph: 1}
      - {pcode: C0000001, article: "185-3", paragraph: 1}
    forms: [交通違規勸導單, 舉發違反道路交通管理事件通知單]

  - id: objection
    phase: 結果處置
    title: 異議處理與救濟告知
    role: 帶班幹部／執勤人員
    source_page: 4
    actions:
      - 民眾當場陳述理由表示異議時，帶班幹部認為有理由者，應立即停止或更正執行行為；認為無理由者，得繼續執行，經民眾請求時，應填製警察行使職權民眾異議紀錄表並交付之。
      - 民眾對舉發違規事實不服者，應委婉說明；仍表不服者，告知其陳述規定與程序。
      - 將未依指示停車接受稽查、拒絕接受酒測及特殊案件登記於工作紀錄簿。
    legal_basis:
      - {pcode: D0080145, article: "29"}
    forms: [警察行使職權民眾異議紀錄表, 工作紀錄簿]

  - id: arrest
    phase: 移送法辦
    title: 逮捕現行犯與告知權利
    role: 執勤人員
    source_page: 6
    actions:
      - 依刑事訴訟法第八十八條規定逮捕現行犯或準現行犯。
      - 逮捕詢問時，先告知犯罪嫌疑及所犯所有罪名、得保持緘默、得選任辯護人、得請求調查有利證據。
    legal_basis:
      - {pcode: C0010001, article: "88"}
      - {pcode: C0010001, article: "95"}

  - id: evidence
    phase: 移送法辦
    title: 蒐證與測試觀察紀錄表
    role: 執勤人員
    source_page: 6
    actions:
      - 符合刑法第一百八十五條之三第一項第一款（吐氣 0.25 毫克／血液 0.05% 以上）且事證明確者，檢具相關事證移送法辦，無需再檢附測試觀察紀錄表。
      - 符合第一項第二款（其他情事足認不能安全駕駛），或拒絕吐氣檢測且有紀錄表所列客觀情事者，均需檢附「刑法第一百八十五條之三第一項第二款案件測試觀察紀錄表」及相關佐證資料移送。
      - 輔以錄音、錄影（照相）存證，連同調查筆錄、吐氣或血液酒精濃度檢測數值資料併案移送。
    legal_basis:
      - {pcode: C0000001, article: "185-3", paragraph: 1}
    forms: [刑法第一百八十五條之三第一項第二款案件測試觀察紀錄表]

  - id: interrogate
    phase: 移送法辦
    title: 詢問與移送
    role: 執勤人員
    source_page: 6
    actions:
      - 詢問不得於夜間（日出前、日沒後）行之，但經受詢問人明示同意、夜間經拘提或逮捕到場查驗有無錯誤、經檢察官或法官許可、或有急迫情形者，不在此限；犯罪嫌疑人請求立即詢問者，應即時為之。
      - 完成詢問後，將犯罪嫌疑人連同筆錄、舉發通知單（移送聯影本）、酒精測定紀錄單二份（影本）及測試觀察紀錄表，依刑案程序移送分局偵查隊。
    legal_basis:
      - {pcode: C0010001, article: "100-3"}
    forms: [舉發違反道路交通管理事件通知單, 受理各類案件紀錄表]

  - id: crash
    phase: 移送法辦
    title: 肇事拒測或無法檢測
    role: 執勤人員
    source_page: 6
    actions:
      - 汽車駕駛人肇事拒絕接受檢測或無法實施吐氣檢測者，應將其強制移由受委託醫療或檢驗機構實施血液或其他檢體之採樣及測試檢定。
      - 酒駕肇事移送原則：吐氣未達 0.15 毫克（血液未達 0.03%）原則上不依刑法第一百八十五條之三移送，但有其他證據足證不能安全駕駛者，應報告地檢署檢察官並依指示辦理；達 0.15 毫克（0.03%）以上者，移（函）送檢察機關。
    legal_basis:
      - {pcode: K0040012, article: "35", paragraph: 6}
      - {pcode: C0010001, article: "205-2"}
