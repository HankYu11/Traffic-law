  - id: S03
    category: 特殊／跨法規
    q: 酒駕肇事駕駛人拒絕酒測或無法吐氣，警察可以強制抽血嗎？
    as_of: "2027-01-15"
    expected: [K0040012:35]
    points: [得報請檢察官核發鑑定許可書強制移由受委託醫療或檢驗機構實施血液測試檢定, 情況急迫得先行實施並於二十四小時內陳報檢察官許可]
  - id: S04
    category: 特殊／跨法規
    q: 酒測值 0.16 毫克、沒有肇事，可以勸導不開單嗎？
    expected: [D0080029:12]
    points: [吐氣所含酒精濃度超過規定之標準值未逾每公升零點零二毫克者得施以勸導免予舉發]
  - id: S05
    category: 特殊／跨法規
    q: 酒測值 0.3 毫克的汽車駕駛人，除了開罰單還要做什麼？
    expected: [C0000001:185-3, K0040012:35]
    points: [吐氣酒精濃度達零點二五毫克以上構成刑法第185條之3, 應移送法辦, 並依道交條例舉發]
  - id: S06
    category: 特殊／跨法規
    q: 警察可以在什麼情況下攔停車輛？
    expected: [D0080145:8]
    points: [對於已發生危害或依客觀合理判斷易生危害之交通工具得予以攔停]
  - id: S07
    category: 特殊／跨法規
    q: 駕駛人疑似吸毒駕車，拒絕唾液快篩怎麼處理？
    expected: [D0080029:19-4, K0040012:35]
    points: [告知拒絕檢測之法律效果, 處新臺幣二十七萬元罰鍰]
  - id: S08
    category: 特殊／跨法規
    q: 酒駕的汽車駕駛人吊銷駕照後，要完成什麼才能重新考照？
    expected: [K0040012:67]
    points: [未依規定完成酒駕防制教育或酒癮治療不得考領駕駛執照]

