# 版本異動（示範版本控管）。施行日以行政院令為準，可細到「項」。
# 舊版條文由 ingest/fetch_old_version.py 從全國法規資料庫「舊法規內容」頁抓取。
amendments:
  - pcode: K0040012
    promulgated: 2026-08-17          # 115.08.17 總統令修正公布
    order: 行政院 115.10.28 院臺交字第 1151027653 號令
    old_version_label: 115.01.14 修正版
    new_version_label: 115.08.17 修正版
    articles: ["21", "21-1", "35", "67", "73", "85-2", "85-3"]
    effective: 2026-10-31
    # 第 35 條第 6、15 項另定 115.12.31 施行。施行前回答時要標示「尚未施行」，
    # 並提醒向法制單位確認過渡期間適用的規定（舊版第 6、13 項本身也有施行日未定的情形）。
    paragraph_overrides:
      - article: "35"
        new_paragraphs: [6, 15]
        effective: 2026-12-31
        note: 本項定自 115.12.31 施行；施行前之血液測試檢定程序，請洽法制單位確認適用規定。
