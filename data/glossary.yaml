# - triggers：問題出現這些詞時，即使檢索沒取到，也自動帶入該條／項作為出處。
- cite: {pcode: K0040012, article: "3"}
  triggers: [機車, 摩托車]
  text: 第八款「汽車（包括機車）」：條文中對「汽車駕駛人」的規定，機車駕駛人同樣適用。

- cite: {pcode: K0040012, article: "69", paragraph: 1}
  triggers: [腳踏車, 自行車, 單車, 電動自行車, 微電車, 電動輔助自行車]
  text: 腳踏自行車、電動輔助自行車、微型電動二輪車都屬於「慢車」，適用道交條例第三章（慢車）的規定，例如酒駕適用第73條。

- cite: {pcode: D0080029, article: "12", paragraph: 1}
  text: 第十二款「超過規定之標準值未逾每公升零點零二毫克」：標準值為每公升零點一五毫克，所以吐氣酒精濃度每公升零點一五毫克以上、零點一七毫克以下（未肇事、情節輕微）得勸導免予舉發。

- cite: {pcode: K0040013, article: "114"}
  text: 本條「汽車駕駛人」包括機車駕駛人（道交條例第3條第8款「汽車（包括機車）」）。
