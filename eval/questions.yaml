  # ---------------- 特殊／跨法規 ----------------
  - id: S01
    category: 特殊／跨法規
    q: 酒駕被逮捕後，晚上可以直接做筆錄嗎？
    expected: [C0010001:100-3]
    points: [不得於夜間詢問, 例外：受詢問人明示同意、夜間經拘提或逮捕到場查驗有無錯誤、經檢察官或法官許可、有急迫情形]
  - id: S02
    category: 特殊／跨法規
    q: 逮捕酒駕現行犯後詢問前要告知哪些權利？
    expected: [C0010001:95]
