# 評估題庫（示範版 50 題）。正式實證時由實務員警出題、法規室標註正解。
# expected：應引用的條文（pcode:條號），任一命中即算檢索命中；空陣列 = 應拒答。
# points：答案要點，評分時逐項檢查；缺漏或數字錯誤即判錯。
# as_of：查詢基準日（未填 = 2026-11-17）。
defaults:
  as_of: "2026-11-17"

